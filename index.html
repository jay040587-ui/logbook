<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forge">
<meta name="theme-color" id="themecolor" content="#0D0E11">
<link rel="apple-touch-icon" id="touchicon" href="">
<title>Forge — carnet d'entraînement</title>
<style>
:root{
  --bg:#0D0E11;--card:#16181D;--card2:#1F2229;--card3:#282C35;--line:#262A32;--sheet:#15171C;--hdrbg:rgba(13,14,17,.84);
  --txt:#F3F4F6;--mut:#8A909B;--mut2:#5E6470;
  --acc:#C8F04A;--accd:rgba(200,240,74,.14);--ink:#0D0E11;
  --red:#FF5D5D;--ok:#41D69A;--warm:#FFB547;--blue:#6AA8FF;
  --pinbg:rgba(106,168,255,.12);--pintx:#B9D4FF;--notebg:rgba(255,181,71,.12);--notetx:#FFD9A0;
  --r:18px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);transition:background .3s}
html,body{margin:0;color:var(--txt);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none;padding-bottom:calc(150px + var(--sab));-webkit-user-select:none;user-select:none;min-height:100vh}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit;font-size:16px}
svg{display:block}
.ico{width:20px;height:20px}

/* Fonds */
#wall,#pattern{position:fixed;inset:0;z-index:0;pointer-events:none}
#wall{background-size:cover;background-position:center;opacity:0;transition:opacity .4s;transform:scale(1.06)}
#pattern{opacity:.55}
body.has-wall .card,body.has-wall .list,body.has-wall .hero{backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3)}

/* Header */
#hdr{position:sticky;top:0;z-index:20;padding:calc(var(--sat) + 10px) 16px 10px;background:var(--hdrbg);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);display:flex;align-items:center;gap:10px;min-height:60px}
#hdr h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr.sub h1{font-size:19px;font-weight:700}
.hbtn{min-width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--card2);flex:none;position:relative}
.hbtn.txt{padding:0 14px;font-weight:700;font-size:15px}
.hbtn.acc{background:var(--acc);color:var(--ink)}
.hbtn .sdot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px var(--card2)}
.timer-chip{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--acc);background:var(--accd);padding:7px 11px;border-radius:11px}
main{position:relative;z-index:1;padding:2px 14px 24px;max-width:640px;margin:0 auto}

/* Tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + var(--sab));background:var(--hdrbg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);padding:6px 0;position:relative;font-weight:600;transition:color .2s}
.tab svg{width:25px;height:25px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tab.on{color:var(--acc)}
.tab.on svg{transform:translateY(-1px) scale(1.08)}
.tab .dot{position:absolute;top:4px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.45}}

/* Generic */
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:12px 0;border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;background:var(--card2);font-weight:700;font-size:16px;transition:transform .12s,opacity .2s}
.btn:active,.hbtn:active,.chip:active,.icon:active,.wbtn:active{transform:scale(.95)}
.btn.primary{background:var(--acc);color:var(--ink)}
.btn.danger{background:rgba(255,93,93,.14);color:var(--red)}
.btn.block{display:flex;width:100%}
.btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.35}
.btn svg{width:18px;height:18px}
.link{display:block;width:100%;text-align:center;padding:14px;color:var(--mut);font-weight:600;font-size:15px}
.link.danger{color:var(--red)}
.muted{color:var(--mut)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.section-t{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 4px 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;height:34px;padding:0 13px;border-radius:17px;background:var(--card2);color:var(--txt);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid transparent;transition:background .15s,color .15s}
.chip.on{background:var(--acc);color:var(--ink)}
.chip.sm{height:28px;padding:0 10px;font-size:13px;border-radius:14px}
.chip svg{width:15px;height:15px}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty svg{width:52px;height:52px;margin:0 auto 12px;color:var(--mut2)}
.empty b{display:block;color:var(--txt);font-size:18px;margin-bottom:6px}
.search{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:13px;padding:0 12px;height:44px}
.search svg{width:18px;height:18px;color:var(--mut)}
.search input{flex:1;background:none;border:0;outline:0;height:100%}
.field{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:12px 14px;outline:0;transition:border-color .2s}
.field:focus{border-color:var(--acc)}
textarea.field{min-height:96px;resize:vertical;line-height:1.4}
label.lbl{display:block;font-size:13px;color:var(--mut);font-weight:600;margin:14px 2px 6px}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--accd);color:var(--acc)}

/* Accueil */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--acc) 24%,transparent),transparent 55%),var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:10px 0 6px}
.hero h2{margin:0 0 4px;font-size:24px;letter-spacing:-.02em;position:relative}
.hero p{margin:0 0 16px;color:var(--mut);position:relative;max-width:68%}
.hero .btn{position:relative}
.hero .illu{position:absolute;right:-6px;bottom:64px;height:150px;max-width:46%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.hero.has-illu p,.hero.has-illu h2{max-width:58%}
body.aura .hero{animation:aura 3s ease-in-out infinite}
@keyframes aura{50%{box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 60%,transparent),0 0 34px color-mix(in srgb,var(--acc) 38%,transparent)}}
body.aura .timer-chip{box-shadow:0 0 16px color-mix(in srgb,var(--acc) 45%,transparent)}
.hero-row{display:flex;gap:8px;margin-top:8px;position:relative}
.hero-row .btn{white-space:nowrap;font-size:15px;padding:0 10px}
.tpl-card{display:flex;align-items:center;gap:12px}
.tpl-card .grow b{display:block;font-size:17px}
.tpl-card .grow span{display:block;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.play{width:46px;height:46px;border-radius:50%;background:var(--acc);color:var(--ink);display:grid;place-items:center;flex:none}
.play svg{width:18px;height:18px;margin-left:2px}
.banner{display:flex;align-items:center;gap:10px;background:var(--pinbg);color:var(--blue);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;margin:12px 0;width:100%;text-align:left}
.banner svg{width:20px;height:20px;flex:none}

/* Séance */
.sess-top input.title{width:100%;background:none;border:0;outline:0;font-size:22px;font-weight:800;letter-spacing:-.02em;padding:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card2);border-radius:12px;padding:10px}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mut)}
.ex{padding:12px 12px 8px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.ex-head{display:flex;align-items:flex-start;gap:6px}
.ex-title{flex:1;min-width:0;text-align:left;padding:2px 2px 0}
.ex-name{display:block;font-size:17px;font-weight:700;line-height:1.2}
.ex-meta{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}
.ex-count{font-size:13px;font-weight:700;color:var(--mut);padding:9px 4px 0;font-variant-numeric:tabular-nums}
.ex-count.full{color:var(--ok)}
.icon{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--mut);flex:none;transition:transform .12s}
.icon svg{width:19px;height:19px}
.icon.on{color:var(--warm);background:var(--notebg)}
.ex-info{display:flex;align-items:center;gap:8px;margin:8px 0 2px;flex-wrap:wrap}
.last{font-size:12.5px;color:var(--mut)}
.last b{color:var(--txt);font-weight:600}
.pin,.inote{font-size:13.5px;border-radius:10px;padding:8px 10px;margin:8px 0 2px;display:flex;gap:7px;align-items:flex-start;white-space:pre-wrap;width:100%;text-align:left}
.pin{background:var(--pinbg);color:var(--pintx)}
.inote{background:var(--notebg);color:var(--notetx)}
.pin svg,.inote svg{width:15px;height:15px;flex:none;margin-top:1px}
.sets-head{display:grid;gap:6px;font-size:11px;font-weight:700;color:var(--mut2);text-transform:uppercase;letter-spacing:.06em;padding:10px 0 4px;text-align:center}
.g2{grid-template-columns:34px 1fr 1fr 42px}
.g3{grid-template-columns:34px 1fr 1fr 1fr 42px}
.set-wrap{position:relative;overflow:hidden;border-radius:12px;margin:4px 0}
.set-wrap.pop{animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.sww{position:relative;overflow:hidden}
.swd{position:absolute;left:0;top:0;bottom:0;width:88px;background:var(--red);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;opacity:0;transition:opacity .15s}
.swd svg{width:21px;height:21px}
.sww.swiping>.swd,.sww:has(>.swb.open)>.swd{opacity:1}
.swb{position:relative;transition:transform .25s cubic-bezier(.2,.9,.3,1)}
.swb.open{transform:translateX(88px)}
.cardw{margin:12px 0;border-radius:var(--r)}
.cardw>.card{margin:0}
.cardw>.swd{width:100%;border-radius:var(--r);align-items:flex-start;padding-left:26px}
.list>.sww>.li{background:var(--card)}
.list>.sww{border-bottom:1px solid var(--line)}.list>.sww:last-child{border-bottom:0}.list>.sww>.li{border-bottom:0}
.set-wrap>.swd{border-radius:12px}
.set-row{position:relative;display:grid;gap:6px;align-items:center;background:var(--card);padding:3px 0;transition:transform .25s cubic-bezier(.2,.9,.3,1),background .2s;border-radius:12px}
body.has-wall .set-row{background:transparent}
.set-row.done{background:linear-gradient(rgba(65,214,154,.12),rgba(65,214,154,.12)),var(--card)}
.set-num{height:40px;border-radius:10px;background:var(--card2);font-weight:800;font-size:15px;position:relative;font-variant-numeric:tabular-nums}
.set-num.warm{color:var(--warm)}
.set-num.flag::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--warm)}
.wbtn{height:40px;border-radius:10px;background:var(--card2);display:flex;align-items:baseline;justify-content:center;gap:3px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;transition:transform .12s,background .2s;border:1px solid transparent}
.wbtn small{font-size:12px;font-weight:600;color:var(--mut)}
.wbtn.wempty{color:var(--mut2);align-items:center}
.wbtn:focus-visible{border-color:var(--acc)}
.stepper{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;background:var(--card2);border-radius:10px;height:40px;overflow:hidden}
.stepper button{height:100%;font-size:20px;font-weight:500;color:var(--mut);transition:background .1s}
.stepper button:active{background:var(--card3);color:var(--txt)}
input.num{width:100%;min-width:0;background:none;border:0;outline:0;text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;padding:0;height:40px}
.cell{background:var(--card2);border-radius:10px;height:40px}
input.num::placeholder{color:var(--mut2)}
.bump{animation:bump .2s}
@keyframes bump{50%{transform:scale(1.15)}}
.check{width:42px;height:40px;border-radius:10px;background:var(--card2);display:grid;place-items:center;color:var(--mut2);transition:background .2s,color .2s,transform .15s;position:relative}
.check svg{width:20px;height:20px;stroke-width:3}
.done .check{background:var(--ok);color:#0D0E11;animation:tick .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes tick{40%{transform:scale(1.15)}}
.check.ghost{background:none}
.done input.num,.done .wbtn{color:var(--ok)}
.snote{font-size:12.5px;color:var(--notetx);padding:2px 8px 6px 44px;white-space:pre-wrap;text-align:left;width:100%}
.add-set{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:40px;margin-top:6px;border-radius:11px;color:var(--acc);font-weight:700;font-size:14.5px;background:var(--accd)}
.add-set svg{width:17px;height:17px}
.big-add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border:2px dashed var(--line);border-radius:var(--r);color:var(--mut);font-weight:700;margin:12px 0}
.big-add svg{width:20px;height:20px}
.add-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.add-row .big-add{gap:6px;font-size:14px}
.glegend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.gleg{font-size:13.5px;background:var(--card2);padding:6px 10px;border-radius:9px;font-weight:600;display:flex;align-items:center;gap:6px}
.gleg b{color:var(--acc);font-weight:900}
.gleg.add{color:var(--acc);padding:6px 8px}.gleg.add svg{width:15px;height:15px}
.ground{border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
.grh{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:2px 2px 0}
.grh button{width:28px;height:28px;border-radius:8px;color:var(--mut2);display:grid;place-items:center}.grh button svg{width:15px;height:15px}
.gdone .grh{color:var(--ok)}
.group-card .set-num{color:var(--acc)}
.group-card .wbtn.wempty small,.group-card input.num::placeholder{font-size:12px;color:var(--mut2);font-weight:600}
.add-row .big-add{margin:12px 0 4px;font-size:14.5px}

/* Impact */
.burst{position:fixed;z-index:80;pointer-events:none;width:120px;height:120px;margin:-60px 0 0 -60px;animation:burst .6s cubic-bezier(.2,.9,.3,1) forwards}
.burst span{position:absolute;inset:0;display:grid;place-items:center;font:900 italic 22px/1 system-ui;color:var(--ink);letter-spacing:-.02em;transform:rotate(-8deg)}
@keyframes burst{0%{transform:scale(.2) rotate(-20deg);opacity:1}60%{transform:scale(1.1) rotate(4deg);opacity:1}100%{transform:scale(1.3);opacity:0}}

/* HIIT card */
.hiit-card .ex-meta{color:var(--acc)}
.hmoves{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.hmoves span{font-size:13px;background:var(--card2);padding:5px 9px;border-radius:9px}
.hres{display:flex;align-items:center;gap:8px;background:rgba(65,214,154,.12);color:var(--ok);border-radius:11px;padding:9px 12px;font-weight:700;margin:10px 0 2px;font-size:14.5px}
.hres svg{width:18px;height:18px}
.hiit-tag{font-size:11px;font-weight:800;letter-spacing:.06em;background:var(--acc);color:var(--ink);padding:3px 7px;border-radius:7px;margin-right:6px;vertical-align:2px}

/* Lists */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:10px 0}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;transition:background .15s}
.li:last-child{border-bottom:0}
.li:active{background:var(--card2)}
.li .grow b{display:block;font-weight:600;font-size:16px}
.li .grow span{display:block;font-size:13px;color:var(--mut);margin-top:1px}
.li .chev{color:var(--mut2);width:18px;height:18px}
.av{width:38px;height:38px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--acc);flex:none}
.sel .av{background:var(--acc);color:var(--ink)}
.day{width:50px;text-align:center;flex:none;background:var(--card2);border-radius:12px;padding:6px 0}
.day b{display:block;font-size:20px;line-height:1}
.day span{font-size:11px;color:var(--mut);text-transform:uppercase;font-weight:700}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.spark{width:100%;height:110px;margin-top:6px}
.hist-sets{font-size:14px;color:var(--mut);margin-top:3px;line-height:1.5}
.hist-sets b{color:var(--txt);font-weight:600}

/* Rest bar */
#restbar{position:fixed;left:10px;right:10px;bottom:calc(70px + var(--sab));z-index:29;border-radius:18px;background:var(--card3);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);transform:translateY(140%);opacity:0;visibility:hidden;transition:transform .35s cubic-bezier(.2,.9,.3,1),opacity .25s,visibility 0s .35s;max-width:620px;margin:0 auto}
#restbar.show{transform:none;opacity:1;visibility:visible;transition-delay:0s}
#restbar .prog{position:absolute;inset:0;background:color-mix(in srgb,var(--acc) 24%,transparent);transform-origin:left;transition:transform .25s linear}
#restbar .in{position:relative;display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px}
#restbar .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.75}
#restbar .time{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#restbar .txtwrap{display:flex;flex-direction:column;flex:1}
#restbar button{height:38px;min-width:46px;padding:0 10px;border-radius:11px;background:rgba(0,0,0,.25);font-weight:700;font-size:14px;color:inherit}
#restbar.over{background:var(--acc);color:var(--ink)}

/* Sheets */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:72;opacity:0;transition:opacity .25s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:73;background:var(--sheet);border-radius:24px 24px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.3,1);padding-bottom:var(--sab);max-width:640px;margin:0 auto;border-top:1px solid var(--line)}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--card3);margin:8px auto 2px;flex:none}
.sh-head{display:flex;align-items:center;gap:10px;padding:8px 16px 10px;flex:none}
.sh-head h3{flex:1;margin:0;font-size:19px;letter-spacing:-.01em}
.sh-body{overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch;flex:1}
.sh-foot{padding:10px 16px 14px;flex:none;border-top:1px solid var(--line)}
.menu .li{background:var(--card)}
.menu .li svg{width:20px;height:20px;color:var(--mut)}
.menu .li.danger,.menu .li.danger svg{color:var(--red)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--card3);color:var(--txt)}

const weekKey=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const addDays=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()};
const trunc=(s,n)=>(s=String(s??''),s.length>n?s.slice(0,n-1)+'…':s);

const volFmt=v=>v>=10000?fmtNum(Math.round(v/100)/10)+' t':fmtKg(v);

/* =================== Graphiques =================== */
function niceStep(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function chartSVG(pts,o={}){
  const {type='bar',H=170,W=340,fmt=v=>fmtNum(Math.round(v*10)/10),unit='',col='var(--acc)',ink='var(--mut)',grid='var(--line)',bg='var(--card)',font='',pos='',tip=true}=o;
  const n=pts.length;if(!n)return '';
  const yf=o.yfmt||fmt,ff=font?` font-family="${font}"`:'';
  const pl=42,pr=12,pt=10,pb=24,cw=W-pl-pr,ch=H-pt-pb;
  const vals=pts.map(p=>p.y);let lo=0,hi;
  if(type==='line'){const a=Math.min(...vals),b=Math.max(...vals);const r=(b-a)||Math.max(1,Math.abs(b)*.1);const st=niceStep((r*1.5)/3);lo=Math.max(0,Math.floor((a-r*.25)/st)*st);hi=lo+st*3;while(hi<b)hi+=st}
  else{const st=niceStep((Math.max(...vals)||1)/3);hi=st*3;while(hi<Math.max(...vals))hi+=st}
  const X=i=>type==='bar'?pl+cw*(i+.5)/n:pl+(n===1?cw/2:cw*i/(n-1));
  const Y=v=>pt+ch*(1-(v-lo)/((hi-lo)||1));
  let g='';const gl=Math.round((hi-lo)/niceStep((hi-lo)/3));
  for(let k=0;k<=gl;k++){const v=lo+(hi-lo)*k/gl;const y=Y(v).toFixed(1);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" style="stroke:${grid}" stroke-width="1"/><text x="${pl-6}" y="${+y+3.5}" text-anchor="end" font-size="10" style="fill:${ink}"${ff}>${esc(yf(v))}</text>`}
  const step=Math.ceil(n/6);let xl='';
  pts.forEach((p,i)=>{if(i%step===0){const x=X(i);const an=x>W-pr-18?'end':x<pl+18?'start':'middle';xl+=`<text x="${(an==='end'?Math.min(x+6,W-2):an==='start'?Math.max(x-6,pl-4):x).toFixed(1)}" y="${H-6}" text-anchor="${an}" font-size="10" style="fill:${ink}"${ff}>${esc(p.x)}</text>`}});
  let m='';
  if(type==='bar'){const bw=Math.max(3,Math.min(26,cw/n*.62));pts.forEach((p,i)=>{if(!(p.y>0))return;const x0=X(i)-bw/2,x1=X(i)+bw/2,y=Y(p.y),b=Y(0);const r=Math.min(4,bw/2,b-y);
    m+=`<path d="M${x0.toFixed(1)} ${b.toFixed(1)}V${(y+r).toFixed(1)}Q${x0.toFixed(1)} ${y.toFixed(1)} ${(x0+r).toFixed(1)} ${y.toFixed(1)}H${(x1-r).toFixed(1)}Q${x1.toFixed(1)} ${y.toFixed(1)} ${x1.toFixed(1)} ${(y+r).toFixed(1)}V${b.toFixed(1)}Z" style="fill:${col}"/>`})}
  else{const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join('');
    m+=`<path d="${d}" fill="none" style="stroke:${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(n<=40&&o.dots!==false)pts.forEach((p,i)=>{m+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4" style="fill:${col};stroke:${bg}" stroke-width="2"/>`})}
  let hit='';
  if(tip){const w=type==='bar'||n===1?cw/n:cw/(n-1);pts.forEach((p,i)=>{const x=type==='bar'?pl+w*i:Math.max(pl,X(i)-w/2);hit+=`<rect x="${x.toFixed(1)}" y="${pt}" width="${(type==='bar'?w:Math.min(w,W-pr-x)).toFixed(1)}" height="${ch}" fill="transparent" data-tip="${esc((p.t||p.x)+' · '+fmt(p.y)+unit)}"/>`})}
  return `<svg ${pos||`class="chart" viewBox="0 0 ${W} ${H}"`} xmlns="http://www.w3.org/2000/svg">${g}${m}${xl}${hit}</svg>`;
}
function hbarsHTML(rows,fmt=v=>fmtNum(v)){const mx=Math.max(1,...rows.map(r=>r.v));return `<div class="hb">${rows.map(r=>`<div class="hbr" data-tip="${esc(r.l+' · '+fmt(r.v))}"><span>${esc(r.l)}</span><div><i style="width:${Math.max(1.5,r.v/mx*100)}%"></i></div><b>${esc(fmt(r.v))}</b></div>`).join('')}</div>`}
function hbarsSVG(rows,x,y,W,fmt,c,mx0){const mx=mx0||Math.max(1,...rows.map(r=>r.v));const lw=170,vw=70,bw=W-lw-vw;
  return rows.map((r,i)=>{const yy=y+i*22;return `<text x="${x}" y="${yy+13}" font-size="10.5" fill="${c.mut}" font-family="${c.font}">${esc(trunc(r.l,30))}</text><rect x="${x+lw}" y="${yy+3}" width="${bw}" height="12" rx="3" fill="#F1F2F4"/><rect x="${x+lw}" y="${yy+3}" width="${Math.max(2,r.v/mx*bw).toFixed(1)}" height="12" rx="3" fill="${c.acc}"/><text x="${x+W}" y="${yy+13}" font-size="10.5" font-weight="700" text-anchor="end" fill="${c.ink}" font-family="${c.font}">${esc(fmt(r.v))}</text>`}).join('')}
const chartCard=c=>`<div class="card chart-card"><div class="cc-t">${esc(c.t)}</div>${c.o?.sub?`<div class="small muted">${esc(c.o.sub)}</div>`:''}${c.pts.length>1?chartSVG(c.pts,c.o):`<div class="small muted" style="margin-top:8px">Encore une séance pour voir l’évolution${c.pts[0]?' ('+esc(c.o?.fmt?c.o.fmt(c.pts[0].y):fmtNum(c.pts[0].y))+(c.o?.unit||'')+' la dernière fois)':''}.</div>`}</div>`;

/* =================== Stats =================== */
const PERIODS={'4w':'4 sem.','3m':'3 mois','6m':'6 mois','1y':'1 an','all':'Tout'};
function periodFrom(p){const d=new Date();d.setHours(0,0,0,0);const m={'4w':28,'3m':91,'6m':182,'1y':365}[p];return m?d.getTime()-m*864e5:(sessions().at(-1)?.start||Date.now())}
const wlabel=k=>dfmt(k,{day:'numeric',month:'short'}).replace('.','');
function statsData(p){
  const from=periodFrom(p);const L=sessions().filter(s=>s.start>=from);
  const wk=[];for(let k=weekKey(from);k<=weekKey(Date.now());k=addDays(k,7))wk.push({k,n:0,vol:0,dur:0});
  const mus={},exc={};let vol=0,dur=0,sets=0;
  L.forEach(s=>{const st=sessStats(s);vol+=st.vol;dur+=st.dur;sets+=st.sets;const w=wk.find(x=>x.k===weekKey(s.start));if(w){w.n++;w.vol+=st.vol;w.dur+=st.dur}
    flat(s.items).forEach(it=>{if(isH(it))return;const e=exById(it.exId);const d=it.sets.filter(x=>x.done&&!x.warm).length;if(!d)return;mus[e.muscle]=(mus[e.muscle]||0)+d;exc[it.exId]=(exc[it.exId]||0)+1})});
  return {L,wk,vol,dur,sets,perWeek:L.length/Math.max(1,wk.length),mus:Object.entries(mus).map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v),exc:Object.entries(exc).sort((a,b)=>b[1]-a[1])};
}
function statsSpecs(D){
  const t=k=>'Semaine du '+wlabel(k);
  return [
    {t:'Séances par semaine',pts:D.wk.map(w=>({x:wlabel(w.k),t:t(w.k),y:w.n})),o:{fmt:v=>String(Math.round(v)),unit:' séance(s)',yfmt:v=>String(Math.round(v))}},

function exSeries(id){
  const e=exById(id);

    const o={x:dfmt(s.start,{day:'numeric',month:'short'}).replace('.',''),t:dfmt(s.start,{weekday:'short',day:'numeric',month:'short'})};
    if(e.type==='s'){o.w=Math.max(0,...d.map(x=>+x.w||0));o.rm=Math.max(0,...d.map(e1));o.vol=d.reduce((a,x)=>a+(+x.w||0)*(+x.r||0),0);o.reps=d.reduce((a,x)=>a+(+x.r||0),0)}
    else if(e.type==='t')o.d=Math.max(0,...d.map(x=>+x.d||0));
    else{o.cm=d.reduce((a,x)=>a+(+x.cm||0),0);const pc=d.filter(x=>+x.cm>0&&+x.cs>0).map(x=>x.cs/x.cm*500);o.pace=pc.length?Math.min(...pc):null}

}

function sessionInsights(s){
  const prevAll=sessions().filter(x=>x.start<s.start&&x.id!==s.id);
  const prev=prevAll.find(x=>s.tplId?x.tplId===s.tplId:x.name===s.name)||null;
  const recs=[],sugg=[],rows=[],hiit=[];const inc=S.settings.step>=2.5?S.settings.step:2.5;
  flat(s.items).forEach(it=>{
    if(isH(it)){if(it.res)hiit.push([itemName(it),hResult(it)]);return}
    const e=exById(it.exId);const d=it.sets.filter(x=>x.done&&!x.warm);if(!d.length)return;
    let pw=0,p1=0,pd=0,pk=0,had=false,lastD=null;
    for(const ps of prevAll)for(const pi of flat(ps.items)){if(isH(pi)||pi.exId!==it.exId)continue;const q=pi.sets.filter(x=>x.done&&!x.warm);if(!q.length)continue;had=true;if(!lastD)lastD=q;q.forEach(x=>{pw=Math.max(pw,+x.w||0);p1=Math.max(p1,e1(x));pd=Math.max(pd,+x.d||0);pk=Math.max(pk,+x.cm||0)})}
    if(e.type==='s'){
      const mw=Math.max(...d.map(x=>+x.w||0)),m1=Math.max(...d.map(e1)),vol=d.reduce((a,x)=>a+(+x.w||0)*(+x.r||0),0),reps=d.reduce((a,x)=>a+(+x.r||0),0);
      if(had&&mw>pw)recs.push(`${e.name} : ${fmtNum(mw)} kg (record précédent ${fmtNum(pw)} kg)`);
      else if(had&&mw>0&&m1>p1+.05)recs.push(`${e.name} : 1RM estimé ${fmtNum(Math.round(m1*2)/2)} kg`);
      if(lastD&&mw>0){const lw=Math.max(...lastD.map(x=>+x.w||0));const lr=Math.min(...lastD.filter(x=>(+x.w||0)===lw).map(x=>+x.r||0));const cr=Math.min(...d.filter(x=>(+x.w||0)===mw).map(x=>+x.r||0));
        if(mw>=lw&&cr>=lr&&cr>0)sugg.push(`${e.name} : tente ${fmtNum(mw+inc)} kg la prochaine fois`);
        else if(cr<lr)sugg.push(`${e.name} : reste à ${fmtNum(mw)} kg et vise ${lr} reps`)}
      rows.push({l:e.name,v:vol,desc:`${d.length} série${d.length>1?'s':''} · ${reps} reps${mw?' · max '+fmtNum(mw)+' kg':''}`});
    }else if(e.type==='t'){const md=Math.max(...d.map(x=>+x.d||0));if(had&&md>pd)recs.push(`${e.name} : ${md} s (record)`);rows.push({l:e.name,v:0,desc:`${d.length} séries · max ${md} s`})}
    else{const dist=d.reduce((a,x)=>a+(+x.cm||0),0),tm=d.reduce((a,x)=>a+(+x.cs||0),0),mk=Math.max(...d.map(x=>+x.cm||0));if(had&&mk>pk)recs.push(`${e.name} : ${fmtDist(mk)} (record de distance)`);
      rows.push({l:e.name,v:0,desc:[dist?fmtDist(dist):'',tm?fmtDur(tm):'',dist&&tm?'allure '+fmtDur(tm/dist*500)+'/500 m':''].filter(Boolean).join(' · ')||`${d.length} séries`})}
  });
  return {prev,recs,sugg:sugg.slice(0,6),rows,hiit};
}

/* =================== PDF (généré sur le téléphone, sans connexion) =================== */
const PW=595.28,PH=841.89;
function pdfColors(){const a=S.theme.acc;return {acc:lum(a)>.4?mixc(a,'#000000',.35):a,ink:'#15171B',mut:'#6B7280',grid:'#E6E8EC',font:'Helvetica, Arial, sans-serif'}}
function wrapText(t,n){const out=[];String(t||'').split('\n').forEach(par=>{let line='';par.split(/\s+/).forEach(w=>{if((line+' '+w).trim().length>n){if(line)out.push(line);line=w}else line=(line+' '+w).trim()});out.push(line)});return out}
function pdfDoc(title,sub){
  const c=pdfColors(),pages=[];let cur='',y=0;
  const T=(x,yy,t,o='')=>`<text x="${x}" y="${yy}" font-family="${c.font}" ${o}>${esc(t)}</text>`;
  const start=first=>{cur='';y=36;if(first){cur+=T(20,y+20,title,`font-size="22" font-weight="700" fill="${c.ink}"`)+T(20,y+40,sub,`font-size="11" fill="${c.mut}"`)+`<rect x="20" y="${y+50}" width="44" height="3" rx="1.5" fill="${c.acc}"/>`;y+=70}};
  start(true);
  const d={
    need(h){if(y+h>PH-44){pages.push(cur);start(false)}},
    title(t){d.need(28);cur+=T(20,y+15,t,`font-size="13" font-weight="700" fill="${c.ink}"`);y+=24},
    kpis(arr){d.need(58);const w=(PW-40-(arr.length-1)*8)/arr.length;arr.forEach(([l,v],i)=>{const x=20+i*(w+8);cur+=`<rect x="${x}" y="${y}" width="${w}" height="48" rx="8" fill="#F3F4F6"/>`+T(x+10,y+22,v,`font-size="15" font-weight="700" fill="${c.ink}"`)+T(x+10,y+38,l,`font-size="9.5" fill="${c.mut}"`)});y+=60},
    chart(t,pts,o={}){if(pts.length<2)return;d.need(24+168);d.title(t);cur+=chartSVG(pts,{...o,W:555,H:160,col:c.acc,ink:c.mut,grid:c.grid,bg:'#FFFFFF',font:c.font,tip:false,pos:`x="20" y="${y}" width="555" height="160" viewBox="0 0 555 160"`});y+=172},
    hbars(t,rows,fmt){if(!rows.length)return;d.need(24+Math.min(rows.length,6)*22);d.title(t);const mx=Math.max(1,...rows.map(r=>r.v));rows.forEach(r=>{d.need(22);cur+=hbarsSVG([r],20,y,555,fmt,c,mx);y+=22});y+=8},
    rows(t,rows){if(!rows.length)return;if(t){d.need(24+18*Math.min(3,rows.length));d.title(t)}
      rows.forEach(([l,r])=>{d.need(19);cur+=T(20,y+12,trunc(l,70),`font-size="10.5" fill="${c.ink}"`)+T(575,y+12,trunc(r||'',60),`font-size="10.5" text-anchor="end" fill="${c.mut}"`)+`<line x1="20" x2="575" y1="${y+18}" y2="${y+18}" stroke="${c.grid}"/>`;y+=19});y+=10},
    text(t){wrapText(t,105).forEach(l=>{d.need(15);cur+=T(20,y+11,l,`font-size="10.5" fill="${c.ink}"`);y+=15});y+=8},
    async save(fname){
      pages.push(cur);const n=pages.length,imgs=[];
      for(let i=0;i<n;i++){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(PW*2)}" height="${Math.round(PH*2)}" viewBox="0 0 ${PW} ${PH}"><rect width="${PW}" height="${PH}" fill="#FFFFFF"/>${pages[i]}${T(20,PH-20,'Forge · '+dfmt(Date.now(),{day:'numeric',month:'long',year:'numeric'}),`font-size="9" fill="${c.mut}"`)}${T(575,PH-20,(i+1)+' / '+n,`font-size="9" text-anchor="end" fill="${c.mut}"`)}</svg>`;imgs.push(await svgToJpeg(svg))}
      const file=new File([buildPdf(imgs)],fname,{type:'application/pdf'});
      await shareFile(file,title);return file;
    }};
  return d;
}
function svgToJpeg(svg){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{try{const cv=document.createElement('canvas');cv.width=Math.round(PW*2);cv.height=Math.round(PH*2);const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(img,0,0,cv.width,cv.height);
  const b=atob(cv.toDataURL('image/jpeg',.9).split(',')[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);res({bytes:u,w:cv.width,h:cv.height})}catch(e){rej(e)}};img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}
function buildPdf(imgs){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const put=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(id,head,stream)=>{offs[id]=len;put(`${id} 0 obj\n${head}\n`);if(stream){put('stream\n');put(stream);put('\nendstream\n')}put('endobj\n')};
  put('%PDF-1.4\n%âã\n');
  const n=imgs.length;const kids=imgs.map((_,i)=>`${3+i*3} 0 R`).join(' ');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`);
  imgs.forEach((im,i)=>{const p=3+i*3;const cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`);
    obj(p+1,`<< /Length ${cs.length} >>`,enc.encode(cs));
    obj(p+2,`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>`,im.bytes)});
  const xref=len,N=3+n*3;let x=`xref\n0 ${N}\n0000000000 65535 f \n`;for(let i=1;i<N;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  put(x+`trailer\n<< /Size ${N} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
async function shareFile(file,title){
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('PDF prêt')}catch(e){toast('Export impossible ici')}
}

/* =================== Sheets =================== */
let curSheet=null;
function sheet(html,{onClose}={}){
  if(curSheet)curSheet.close();
  const bd=document.createElement('div');bd.className='backdrop';
  const el=document.createElement('div');el.className='sheet';el.innerHTML='<div class="grab"></div>'+html;
  document.body.append(bd,el);
  requestAnimationFrame(()=>{bd.classList.add('show');el.classList.add('show')});
  const close=()=>{if(curSheet!==api)return;curSheet=null;bd.classList.remove('show');el.classList.remove('show');setTimeout(()=>{bd.remove();el.remove()},320);onClose&&onClose()};
  bd.addEventListener('click',close);
  el.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',close));
  const grab=el.querySelector('.grab'),head=el.querySelector('.sh-head');let sy=null,dy=0;
  [grab,head].forEach(h=>h&&h.addEventListener('touchstart',ev=>{sy=ev.touches[0].clientY;dy=0;el.style.transition='none'},{passive:true}));
  el.addEventListener('touchmove',ev=>{if(sy==null)return;dy=Math.max(0,ev.touches[0].clientY-sy);el.style.transform=`translateY(${dy}px)`},{passive:true});
  el.addEventListener('touchend',()=>{if(sy==null)return;el.style.transition='';el.style.transform='';sy=null;if(dy>90)close()});
  const api={el,close};curSheet=api;return api;
}

/* ----- Roue (poids / reps) ----- */
function wheel(box,{label,unit,min=0,max=300,step=1,value,onChange}){
  const IH=48;let vals=[],cur=value===''||value==null?null:+value;
  const build=()=>{vals=[];for(let v=min;v<=max+1e-9;v=Math.round((v+step)*1000)/1000)vals.push(v);
    if(cur!=null&&!vals.some(v=>Math.abs(v-cur)<1e-9)){vals.push(cur);vals.sort((a,b)=>a-b)}};
  build();
  box.innerHTML=`<div class="wheel"><span class="wl">${label}</span><div class="band"></div><div class="sc"><div class="sp"></div><div class="its"></div><div class="sp"></div></div><span class="unit">${unit}</span></div>`;
  const sc=box.querySelector('.sc'),its=box.querySelector('.its');
  const draw=()=>{its.innerHTML=vals.map((v,i)=>`<div class="it" data-i="${i}">${fmtNum(v)}</div>`).join('')};draw();
  let idx=0,raf=0,endT;
  const idxOf=v=>{let b=0,bd=1e9;vals.forEach((x,i)=>{const d=Math.abs(x-v);if(d<bd){bd=d;b=i}});return b};
  const paint=()=>{const i=Math.round(sc.scrollTop/IH);its.querySelectorAll('.it').forEach((el,k)=>{el.classList.toggle('c',k===i);el.classList.toggle('n1',Math.abs(k-i)===1)});return i};
  const setIdx=(i,smooth)=>{idx=Math.max(0,Math.min(vals.length-1,i));sc.scrollTo({top:idx*IH,behavior:smooth?'smooth':'auto'});paint()};
  sc.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const i=paint();if(i!==idx&&vals[i]!=null){idx=i;cur=vals[i];onChange(cur)}})},{passive:true});
  its.addEventListener('click',ev=>{const it=ev.target.closest('.it');if(!it)return;const i=+it.dataset.i;
    if(i===Math.round(sc.scrollTop/IH))edit();else setIdx(i,true)});
  function edit(){
    const inp=document.createElement('input');inp.className='edit';inp.inputMode='decimal';inp.enterKeyHint='done';inp.value=cur==null?'':fmtNum(cur);
    box.querySelector('.wheel').appendChild(inp);inp.focus();inp.select();
    const done=()=>{const v=parseNum(inp.value);inp.remove();if(v===''||v<0)return;cur=Math.round(v*100)/100;build();draw();setIdx(idxOf(cur));onChange(cur)};
    inp.addEventListener('blur',done,{once:true});inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur()});
  }
  requestAnimationFrame(()=>setIdx(cur==null?idxOf(0):idxOf(cur)));
  return {set:v=>{cur=v;build();draw();setIdx(idxOf(v),true);onChange(v)},get:()=>cur,edit};
}
function wheelSheet(c,key='w'){

  const W={w:wheel(sh.el.querySelector('#w1'),{label:'Poids',unit:'kg',min:0,max:400,step:st,value:s.w,onChange:v=>{s.w=v}}),
    r:wheel(sh.el.querySelector('#w2'),{label:sec?'Durée':'Reps',unit:sec?'s':'×',min:0,max:sec?600:100,step:sec?5:1,value:s[f2.k]===''?(sec?30:10):s[f2.k],onChange:v=>{s[f2.k]=v}})};

    sh.el.querySelector('#wq').innerHTML=Q[focus].map(q=>`<button data-q="${q}" ${q===0?'style="color:var(--mut)"':''}>${q===0?'0':(q>0?'+':'−')+fmtNum(Math.abs(q))}</button>`).join('')};
  paintQ();
  sh.el.querySelector('#w1').addEventListener('pointerdown',()=>{if(focus!=='w'){focus='w';paintQ()}});
  sh.el.querySelector('#w2').addEventListener('pointerdown',()=>{if(focus!=='r'){focus='r';paintQ()}});
  sh.el.querySelector('#wq').onclick=ev=>{const b=ev.target.closest('[data-q]');if(!b)return;hap();const q=+b.dataset.q;const w=W[focus];w.set(q===0?0:Math.max(0,Math.round(((+w.get()||0)+q)*100)/100))};
}

function pickerSheet(onPick,{single=false,title='Ajouter des exercices',cta='Ajouter'}={}){
  const sel=new Set();let muscle='Tous',q='';
  const recent=[];sessions().slice(0,15).forEach(s=>flat(s.items).forEach(i=>{if(!isH(i)&&!recent.includes(i.exId))recent.push(i.exId)}));
  const sh=sheet(head(title)+`<div style="padding:0 16px 8px;flex:none"><div class="search">${IC.search}<input id="pq" placeholder="Rechercher ou créer…" type="search" autocomplete="off"></div>

    sh.el.querySelectorAll('#pm [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===muscle));

     +(L.length?`<div class="list" style="margin-top:0">`+L.map(e=>`<button class="li ${sel.has(e.id)?'sel':''}" data-id="${e.id}"><div class="av">${sel.has(e.id)?IC.check:esc(e.muscle.slice(0,2))}</div><div class="grow"><b>${esc(e.name)}</b><span>${esc(e.muscle)} · ${esc(e.equip)}</span></div></button>`).join('')+`</div>`:`<div class="empty small">Aucun exercice trouvé</div>`)

const rb=$('#restbar');let rest={end:0,total:0,iv:null,doneAt:0};
let actx=null;
function unlockAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function tone(freq,t,dur=.16,vol=.35){const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(vol,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+dur);o.connect(g).connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+dur+.02)}
function beep(kind='end'){try{if(!actx)return;
  if(kind==='tick')tone(880,0,.1,.3);
  else if(kind==='go'){tone(1320,0,.35,.4)}
  else if(kind==='rest'){tone(660,0,.3,.35)}
  else [0,.22,.44].forEach((t,i)=>tone(i===2?1320:880,t))}catch(e){}}
function speak(t){if(!S.settings.voice||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=1.05;speechSynthesis.speak(u)}catch(e){}}
function startRest(sec){
  if(!sec)return;unlockAudio();rest.total=sec;rest.end=Date.now()+sec*1000;rest.doneAt=0;

}
function stopRest(){clearInterval(rest.iv);rb.classList.remove('show','over')}
function tickRest(){
  const left=(rest.end-Date.now())/1000;
  rb.querySelector('.prog').style.transform=`scaleX(${Math.max(0,Math.min(1,1-left/rest.total))})`;
  if(left<=0){
    if(!rest.doneAt){rest.doneAt=Date.now();beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}rb.classList.add('over');rb.querySelector('.lbl').textContent='Repos terminé';rb.querySelector('.time').textContent='C’est reparti 💪'}
    if(Date.now()-rest.doneAt>4000)stopRest();

rb.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;hap();const r=b.dataset.r;
  if(r==='skip'){stopRest();return}
  if(rest.doneAt){startRest(Math.max(15,+r));return}
  rest.end+=(+r)*1000;rest.total=Math.max(1,rest.total+(+r));tickRest()});
function tickElapsed(){const el=$('#elapsed');if(!el)return;const s=S.sessions.find(x=>x.id===S.active);if(s)el.textContent=fmtElapsed(Date.now()-s.start)}
setInterval(tickElapsed,1000);

let HT=null;
const PHC={prep:'#FFB547',work:null,rest:'#6AA8FF',up:null};
function buildPhases(h){
  const P=[],mv=hMoves(h),M=i=>mv.length?mv[i%mv.length]:'';
  if(h.prep)P.push({k:'prep',d:h.prep,label:'Prépare-toi',move:M(0)});
  if(h.mode==='interval'||h.mode==='tabata'){
    let n=0;for(let s=1;s<=h.sets;s++){for(let r=1;r<=h.rounds;r++){P.push({k:'work',d:h.work,r,s,move:M(n)});
      const last=r===h.rounds;if(!last&&h.rest)P.push({k:'rest',d:h.rest,r,s,next:M(n+1)});n++}
      if(s<h.sets&&h.setRest)P.push({k:'rest',d:h.setRest,label:'Repos entre séries',s,next:M(n)})}
  }else if(h.mode==='emom'){for(let r=1;r<=h.rounds;r++)P.push({k:'work',d:h.every,r,move:M(r-1),emom:1})}
  else if(h.mode==='amrap')P.push({k:'work',d:h.duration,open:1,move:mv.join(' · ')});
  else P.push({k:'up',d:h.cap,move:mv.join(' · ')});
  return P;
}

const phaseElapsed=()=>((HT.paused?HT.pauseAt:Date.now())-HT.phaseStart)/1000;
function togglePause(force){

function phaseLabel(p){return p.k==='prep'?'Prépare-toi':p.k==='rest'?(p.label||'Repos'):p.k==='up'?'For Time':HT.h.mode==='amrap'?'AMRAP':HT.h.mode==='emom'?'EMOM':'Travail'}
function paintPhase(){

function speakPhase(){const p=HT.ph[HT.i];if(p.k==='prep')speak('Prépare-toi');else if(p.k==='rest')speak(p.label||'Repos');else if(p.k==='up')speak('Partez !');else speak(p.move||'Go')}

function stepVal(c,dir){
  const s=setOf(c),it=itemOf(c);if(!s)return;const e=exById(it.exId);const f=FIELDS[e.type].find(q=>q.k===c.a.dataset.k);
  let v=(+s[f.k]||0)+dir*f.step;v=Math.max(0,Math.round(v*100)/100);s[f.k]=v;save();hap();
  const inp=c.a.parentElement.querySelector('input');inp.value=fmtNum(v);inp.classList.remove('bump');void inp.offsetWidth;inp.classList.add('bump');
}

function saveAsTemplate(s,name,tplId){
  const cp=i=>{if(isH(i))return {id:uid(),kind:'hiit',note:'',rest:null,sets:[],h:{...i.h}};
    if(isG(i)){const ch=i.children.map(cp).filter(c=>c.sets.length);return ch.length?{id:uid(),kind:'group',note:'',rest:i.rest,trans:i.trans,sets:[],children:ch}:null}
    return {id:uid(),exId:i.exId,note:'',rest:i.rest,sets:i.sets.filter(x=>x.done||!s.end).map(x=>{const n=newSet(exById(i.exId).type,x);n.note='';return n})}};
  const items=s.items.map(cp).filter(i=>i&&(isH(i)||isG(i)||i.sets.length));
  if(tplId){const t=S.templates.find(t=>t.id===tplId);if(t){t.items=items;save();return t}}
  const t={id:uid(),name,items};S.templates.push(t);save();return t;
}
function finishSheet(){
  const s=S.sessions.find(x=>x.id===S.active);if(!s)return;const st=sessStats(s);
  const undone=flat(s.items).reduce((a,i)=>a+i.sets.filter(x=>!x.done).length,0)+s.items.filter(i=>isH(i)&&!i.res).length;
  const tpl=s.tplId&&S.templates.find(t=>t.id===s.tplId);
  const sh=sheet(head('Terminer la séance ?')+`<div class="sh-body">
   <div class="stats" style="margin-top:0"><div class="stat"><b>${fmtMin(st.dur)}</b><span>durée</span></div><div class="stat"><b>${st.sets}</b><span>séries validées</span></div><div class="stat"><b>${st.vol?fmtKg(st.vol):'—'}</b><span>volume</span></div></div>
   ${undone?`<label class="switch"><input type="checkbox" id="rm" checked><span>Retirer ce qui n’a pas été fait (${undone})</span></label>`:''}
   ${tpl?`<label class="switch"><input type="checkbox" id="up"><span>Mettre à jour le programme « ${esc(tpl.name)} »</span></label>`:`<label class="switch"><input type="checkbox" id="nt"><span>Enregistrer comme nouveau programme</span></label>`}
  </div><div class="sh-foot"><button class="btn primary block" id="ok">${IC.check} Enregistrer la séance</button></div>`);
  sh.el.querySelector('#ok').onclick=()=>{
    const rm=sh.el.querySelector('#rm');const up=sh.el.querySelector('#up'),nt=sh.el.querySelector('#nt');
    if(up&&up.checked)saveAsTemplate(s,tpl.name,tpl.id);
    if(nt&&nt.checked)saveAsTemplate(s,s.name);
    if(rm&&rm.checked){flat(s.items).forEach(i=>i.sets=i.sets.filter(x=>x.done));s.items.forEach(g=>{if(isG(g))g.children=g.children.filter(c=>c.sets.length)});s.items=s.items.filter(i=>isH(i)?i.res:isG(i)?i.children.length:i.sets.length)}
    else s.items=s.items.filter(i=>isH(i)||(isG(i)?i.children.length:i.sets.length));
    s.end=Date.now();S.active=null;stopRest();wake(false);
    if(!s.items.length){S.sessions=S.sessions.filter(x=>x!==s);save();sh.close();render();toast('Séance vide, rien enregistré');return}
    save();sh.close();ui.tab='history';ui.stack=[{type:'sess',id:s.id},{type:'debrief',id:s.id}];render();syncSoon(1500);
  };
}

function readImage(file,max,keepPng){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL(keepPng?'image/png':'image/jpeg',.8))};img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

/* =================== Synchro Firebase (Firestore REST) =================== */
const fbOn=()=>!!(S.settings.fbKey&&S.settings.fbProject);
let AUTH=null,syncState='idle',syncing=false,syncDirty=false,syncT=null;
try{AUTH=JSON.parse(localStorage.getItem('forge-fb')||'null')}catch(e){}
const saveAuth=()=>{try{AUTH?localStorage.setItem('forge-fb',JSON.stringify(AUTH)):localStorage.removeItem('forge-fb')}catch(e){}};
const fbBase=()=>`https://firestore.googleapis.com/v1/projects/${S.settings.fbProject}/databases/(default)/documents`;
function setSync(st){syncState=st;renderHeader();const el=$('#syncst');if(el)el.innerHTML=syncStatusHTML()}
function fbErr(m=''){
  const M={EMAIL_EXISTS:'Un compte existe déjà avec cet e-mail : utilise « Se connecter ».',EMAIL_NOT_FOUND:'Aucun compte avec cet e-mail : utilise « Créer mon compte ».',INVALID_PASSWORD:'Mot de passe incorrect.',INVALID_LOGIN_CREDENTIALS:'E-mail ou mot de passe incorrect.',INVALID_EMAIL:'Adresse e-mail invalide.',MISSING_PASSWORD:'Entre un mot de passe.',WEAK_PASSWORD:'Mot de passe trop court (6 caractères minimum).',OPERATION_NOT_ALLOWED:'Active « Adresse e-mail/Mot de passe » dans Firebase › Authentication.',CONFIGURATION_NOT_FOUND:'Active Authentication dans la console Firebase.',TOO_MANY_ATTEMPTS_TRY_LATER:'Trop d’essais, réessaie dans quelques minutes.',USER_DISABLED:'Ce compte est désactivé.'};
  if(/API key not valid|API_KEY_INVALID/.test(m))return 'Clé API invalide : vérifie-la dans les Réglages.';
  const k=Object.keys(M).find(k=>m.startsWith(k));return k?M[k]:(m||'Pas de connexion internet');
}
async function fbAuth(path,body){
  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:${path}?key=${encodeURIComponent(S.settings.fbKey)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(fbErr(j.error?.message));return j;
}
function setAuth(j){AUTH={id:j.idToken||j.id_token,exp:Date.now()+((+(j.expiresIn||j.expires_in)||3600)-120)*1000,refresh:j.refreshToken||j.refresh_token,uid:j.localId||j.user_id,email:j.email||AUTH?.email};saveAuth()}
async function fbSignIn(email,pw,create){
  setAuth(await fbAuth(create?'signUp':'signInWithPassword',{email,password:pw,returnSecureToken:true}));
  S.settings.lastPull=0;S.settings.lastPush=0;save();setSync('idle');await sync();
}
async function getToken(){
  if(!AUTH)return null;if(AUTH.id&&Date.now()<AUTH.exp)return AUTH.id;
  try{const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(S.settings.fbKey)}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'refresh_token',refresh_token:AUTH.refresh})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){if(r.status===400||r.status===401){AUTH.id=null;saveAuth();setSync('expired')}return null}
    setAuth(j);return AUTH.id}catch(e){return null}
}
function mergeData(d){
  const del={...(S.deleted||{})};Object.entries(d.deleted||{}).forEach(([k,v])=>{if(!del[k]||v>del[k])del[k]=v});
  const cut=Date.now()-150*864e5;Object.keys(del).forEach(k=>{if(del[k]<cut)delete del[k]});S.deleted=del;
  const m=(a,b)=>{const map=new Map(a.map(x=>[x.id,x]));(b||[]).forEach(x=>{const l=map.get(x.id);if(!l||(x.u||0)>(l.u||0))map.set(x.id,x)});return [...map.values()].filter(x=>!(del[x.id]&&del[x.id]>=(x.u||0)))};
  S.exercises=m(S.exercises,d.exercises);S.templates=m(S.templates,d.templates);
  const act=S.sessions.find(s=>s.id===S.active);
  S.sessions=m(S.sessions.filter(s=>s.end),(d.sessions||[]).filter(s=>s.end));if(act&&!S.sessions.includes(act))S.sessions.push(act);
  SIG.clear();stamp(true);
}
async function sync(){
  if(syncing||!fbOn()||!AUTH)return;
  const t=await getToken();if(!t){if(syncState!=='expired')setSync('error');return}
  syncing=true;syncDirty=false;setSync('syncing');
  try{
    const H={Authorization:'Bearer '+t,'Content-Type':'application/json'};const base=fbBase();
    const docPath=id=>`projects/${S.settings.fbProject}/databases/(default)/documents/users/${AUTH.uid}/items/${id}`;
    // 1) Récupérer ce qui a changé ailleurs
    const since=Math.max(0,(S.settings.lastPull||0)-10*60e3);
    const r=await fetch(`${base}/users/${AUTH.uid}:runQuery`,{method:'POST',headers:H,body:JSON.stringify({structuredQuery:{from:[{collectionId:'items'}],where:{fieldFilter:{field:{fieldPath:'u'},op:'GREATER_THAN',value:{integerValue:String(since)}}}}})});
    if(!r.ok)throw new Error('lecture '+r.status+' '+(await r.text()).slice(0,300));
    const rows=(await r.json()).filter(x=>x.document);
    const inc={exercises:[],templates:[],sessions:[],deleted:{}};let maxU=S.settings.lastPull||0;
    rows.forEach(x=>{const f=x.document.fields||{};const k=f.k?.stringValue,u=+(f.u?.integerValue||0);const id=x.document.name.split('/').pop();if(u>maxU)maxU=u;
      if(k==='del'){inc.deleted[id]=u;return}
      let o=null;try{o=JSON.parse(f.j?.stringValue||'null')}catch(e){}if(!o)return;o.u=u;
      ({ex:inc.exercises,tpl:inc.templates,sess:inc.sessions})[k]?.push(o)});
    if(rows.length)mergeData(inc);
    // 2) Envoyer ce qui a changé ici
    stamp();const lp=S.settings.lastPush||0;const W=[];
    const doc=(id,k,u,o)=>({update:{name:docPath(id),fields:{k:{stringValue:k},u:{integerValue:String(u)},...(o?{j:{stringValue:JSON.stringify(o)}}:{})}}});
    S.exercises.forEach(o=>{if((o.u||0)>lp)W.push(doc(o.id,'ex',o.u,o))});
    S.templates.forEach(o=>{if((o.u||0)>lp)W.push(doc(o.id,'tpl',o.u,o))});
    S.sessions.forEach(o=>{if(o.end&&(o.u||0)>lp)W.push(doc(o.id,'sess',o.u,o))});
    Object.entries(S.deleted||{}).forEach(([id,ts])=>{if(ts>lp)W.push(doc(id,'del',ts))});
    const t0=Date.now();
    for(let i=0;i<W.length;i+=400){const w=await fetch(`${base}:commit`,{method:'POST',headers:H,body:JSON.stringify({writes:W.slice(i,i+400)})});
      if(!w.ok)throw new Error('écriture '+w.status+' '+(await w.text()).slice(0,300))}
    W.forEach(x=>{const u=+x.update.fields.u.integerValue;if(u>maxU)maxU=u});
    S.settings.lastPush=t0;S.settings.lastPull=maxU;S.settings.lastSync=Date.now();S.settings.lastBackup=Date.now();saveNow();setSync('ok');
    if(!curSheet&&!HT&&!document.activeElement?.matches('input,textarea'))render();
  }catch(e){console.warn('sync',e);syncDirty=true;S.settings.lastSyncErr=String(e.message||e).slice(0,160);setSync('error')}
  finally{syncing=false}
}
function scheduleSync(){if(!fbOn()||!AUTH)return;syncDirty=true;clearTimeout(syncT);syncT=setTimeout(sync,15000)}
function syncSoon(ms=1500){if(!fbOn()||!AUTH)return;clearTimeout(syncT);syncT=setTimeout(sync,ms)}
window.addEventListener('online',()=>syncSoon(1000));
function syncStatusHTML(){
  if(!fbOn())return '';
  if(!AUTH)return `<span class="muted">Non connecté</span>`;
  const ls=S.settings.lastSync?new Date(S.settings.lastSync).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'jamais';
  return {syncing:'<b style="color:var(--blue)">Synchronisation…</b>',error:`<b style="color:var(--red)">Synchro impossible</b> (hors ligne ?) · dernière réussie : ${ls}${S.settings.lastSyncErr?`<div class="small muted" style="margin-top:4px">${esc(S.settings.lastSyncErr)}</div>`:''}`,expired:'<b style="color:var(--warm)">Session expirée</b> — reconnecte-toi'}[syncState]||`<b style="color:var(--ok)">Synchronisé</b> · ${esc(AUTH.email||'')} · ${ls}`;
}

async function exportData(){
  stamp();const json=JSON.stringify({...syncPayload(),settings:S.settings,theme:S.theme},null,1);const name=`forge-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([json],name,{type:'application/json'});
  const mark=()=>{S.settings.lastBackup=Date.now();save();render()};
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Sauvegarde Forge'});mark();toast('Sauvegarde envoyée ✔');return}}
  catch(e){if(e&&e.name==='AbortError')return}
  try{const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);mark();toast('Fichier téléchargé')}

}

/* Swipe vers la droite → supprimer (glissement complet = suppression directe) */
let sw=null;const SWO=88;
document.addEventListener('touchstart',e=>{
  const b=e.target.closest('.swb');if(!b||e.target.closest('input,textarea,.sheet,#hiit')){sw=null;return}
  sw={b,x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,lock:null,base:b.classList.contains('open')?SWO:0,w:b.offsetWidth};
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!sw)return;const dx=e.touches[0].clientX-sw.x,dy=e.touches[0].clientY-sw.y;
  if(!sw.lock){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.3)sw.lock=(dx>0||sw.base)?'x':'n';else if(Math.abs(dy)>10)sw.lock='y'}
  if(sw.lock!=='x')return;e.preventDefault();sw.dx=dx;
  document.querySelectorAll('.swb.open').forEach(r=>{if(r!==sw.b)r.classList.remove('open')});
  const pos=Math.max(0,Math.min(sw.w*.92,sw.base+dx));
  sw.b.parentElement.classList.add('swiping');sw.b.style.transition='none';sw.b.style.transform=`translateX(${pos}px)`;
},{passive:false});
document.addEventListener('touchend',()=>{
  if(!sw)return;
  if(sw.lock==='x'){const pos=sw.base+sw.dx,b=sw.b,wr=b.parentElement;b.style.transition='';
    if(pos>sw.w*.55){b.style.transform=`translateX(${sw.w}px)`;hap();const del=wr.querySelector(':scope>.swd');setTimeout(()=>{b.style.transform='';wr.classList.remove('swiping');b.classList.remove('open');if(del)runAct(del)},180)}
    else{b.style.transform='';b.classList.toggle('open',pos>44);setTimeout(()=>wr.classList.remove('swiping'),260)}
    suppress=true;setTimeout(()=>suppress=false,80)}
  sw=null;
});
